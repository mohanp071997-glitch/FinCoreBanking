<div class="otp-page">

  <div class="otp-card">

    <h1>Verify OTP</h1>

    <p class="subtitle">
      Enter the 6-digit OTP sent to your registered email address.
    </p>

    <p class="email">
      {{ email }}
    </p>

    <div class="form-group">
      <label for="otp">OTP</label>

      <input
        id="otp"
        type="text"
        maxlength="6"
        inputmode="numeric"
        [(ngModel)]="otpCode"
        placeholder="Enter 6-digit OTP"
      >
    </div>

    <button
      type="button"
      (click)="verifyOtp()"
      [disabled]="otpCode.length !== 6"
    >
      Verify OTP
    </button>

    <p class="expiry">
      OTP is valid for 5 minutes.
    </p>

  </div>

</div>
